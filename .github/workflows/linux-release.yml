name: Linux nightly

# Builds and publishes the Linux deb and AppImage whenever the published build is stale, plus on
# demand. The rolling release tag `linux-nightly` hosts the generic update feed the desktop app
# reads. This workflow never pushes to the repository: `linux` is rebased onto upstream by hand,
# and until that happens the run reports the drift instead of publishing a build from a stale base.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even when the Linux patch series and upstream are unchanged'
        type: boolean
        default: false
  schedule:
    # 02:00 Asia/Shanghai
    - cron: '0 18 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-nightly
  cancel-in-progress: false

env:
  RELEASE_TAG: linux-nightly
  FEED_URL: https://github.com/catwithoutear/deepseek-harness/releases/download/linux-nightly
  UPSTREAM_REPOSITORY: deepseek-ai/deepseek-harness
  LINUX_BRANCH: linux
  # `gh` resolves the repository from git remotes, and the prepare job adds an `upstream`
  # remote; pin every gh call to this repository or release lookups fall through to
  # upstream, which has no `linux-nightly` release.
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      build_version: ${{ steps.plan.outputs.build_version }}
      product_version: ${{ steps.plan.outputs.product_version }}
      upstream_commit: ${{ steps.plan.outputs.upstream_commit }}
      build_fingerprint: ${{ steps.plan.outputs.build_fingerprint }}
      stale: ${{ steps.inspect.outputs.stale }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.LINUX_BRANCH }}
          fetch-depth: 0
      - name: Inspect the base against upstream
        id: inspect
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream master
          upstream_commit=$(git rev-parse upstream/master)
          behind=$(git rev-list --count "HEAD..upstream/master")
          ahead=$(git rev-list --count "upstream/master..HEAD")
          # The build must come from a branch that already contains its base; this workflow never
          # rebases, so a stale branch has to be reported rather than published from.
          stale=false
          if [ "$behind" -gt 0 ]; then stale=true; fi
          {
            echo "### Linux nightly base"
            echo ""
            echo "- branch \`${LINUX_BRANCH}\`: \`$(git rev-parse --short HEAD)\`"
            echo "- upstream \`master\`: \`${upstream_commit:0:12}\`"
            echo "- ahead of upstream: ${ahead} commits, behind: ${behind} commits"
            if [ "$stale" = true ]; then
              echo ""
              echo "\`${LINUX_BRANCH}\` does not contain the current upstream base, so this run does not publish."
              echo "Rebase it onto \`${upstream_commit:0:12}\` with \`git fetch upstream master && git rebase upstream/master\`,"
              echo "push to \`${LINUX_BRANCH}\`, and check the rebase against upstream with:"
              echo ""
              echo '```'
              echo 'git merge-tree --write-tree --name-only --no-messages upstream/master HEAD'
              echo '```'
              echo ""
              echo "A clean merge means the rebase applies without conflicts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "upstream_commit=$upstream_commit" >> "$GITHUB_OUTPUT"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          echo "Branch behind upstream by ${behind} commits, ahead by ${ahead}, stale: ${stale}"
      - name: Decide whether the build is stale
        id: plan
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          upstream_commit=$(git rev-parse upstream/master)
          product_version=$(git show upstream/master:package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")
          # The three-dot diff covers the patch series alone, so it stays identical across an
          # upstream rebase; --binary keeps binary patch content in the digest.
          patch_digest=$(git diff --binary "upstream/master...HEAD" | sha1sum | cut -d' ' -f1)
          build_fingerprint="${upstream_commit} ${patch_digest}"
          previous=''
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'build-fingerprint.txt'; then
            gh release download "$RELEASE_TAG" --pattern build-fingerprint.txt --dir "$RUNNER_TEMP/previous" --clobber
            previous=$(cat "$RUNNER_TEMP/previous/build-fingerprint.txt")
          fi
          date_segment=$(date -u +%Y%m%d)
          build_version="${product_version}.${date_segment}.${RUN_NUMBER}"
          if [ "$previous" = "$build_fingerprint" ] && [ "${FORCE:-false}" != 'true' ]; then
            needed=false
          else
            needed=true
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "product_version=$product_version" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$upstream_commit" >> "$GITHUB_OUTPUT"
          echo "build_fingerprint=$build_fingerprint" >> "$GITHUB_OUTPUT"
          echo "Previous build fingerprint: ${previous:-<none>}"
          echo "Current build fingerprint: ${build_fingerprint}"
          echo "Upstream ${upstream_commit:0:12}, product ${product_version}, need build: ${needed}"

  package:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true' && needs.prepare.outputs.stale != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.LINUX_BRANCH }}
      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Package AppImage and deb
        env:
          DSH_DESKTOP_TARGET_PLATFORM: linux
          DSH_DESKTOP_TARGET_ARCH: x64
          DSH_DESKTOP_UNSIGNED: '1'
          DSH_DESKTOP_APP_ID: com.deepseek.harness.linux
          DSH_DESKTOP_LINUX_FEED_URL: ${{ env.FEED_URL }}
        run: |
          pnpm --dir apps/desktop exec tsx scripts/package-target.ts linux-x64 --unsigned \
            --build-version "${{ needs.prepare.outputs.build_version }}"
      - name: Sign artifacts
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_KEY_ID: ${{ vars.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/gnupg"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          pnpm --dir apps/desktop exec tsx scripts/sign-linux-artifacts.mjs
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          BUILD_FINGERPRINT: ${{ needs.prepare.outputs.build_fingerprint }}
          PRODUCT_VERSION: ${{ needs.prepare.outputs.product_version }}
          UPSTREAM_COMMIT: ${{ needs.prepare.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          artifacts=apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts
          signing_key=$(GNUPGHOME="$RUNNER_TEMP/gnupg" gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Rolling Linux build of DeepSeek Harness.

          - build version: \`$BUILD_VERSION\`
          - upstream product version: \`$PRODUCT_VERSION\`
          - upstream commit: \`$UPSTREAM_COMMIT\`
          - build fingerprint: \`$BUILD_FINGERPRINT\`
          - signing key: \`$signing_key\`

          The desktop app checks this release's \`nightly-linux.yml\` feed.
          Verify downloads with \`gpg --verify <file>.asc <file>\` after importing
          \`linux-signing-key.asc\`.
          EOF
          cp apps/desktop/linux-signing-key.asc "$artifacts/"
          printf '%s\n' "$BUILD_FINGERPRINT" > "$artifacts/build-fingerprint.txt"
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" --prerelease --title "Linux nightly · $BUILD_VERSION" --notes-file "$notes"
          # Binaries and their signatures first, so the feed never points at missing files.
          gh release upload "$RELEASE_TAG" \
            "$artifacts"/*.AppImage "$artifacts"/*.deb \
            "$artifacts"/*.AppImage.asc "$artifacts"/*.deb.asc \
            "$artifacts/linux-signing-key.asc"
          gh release upload "$RELEASE_TAG" \
            "$artifacts/nightly-linux.yml" "$artifacts/nightly-linux.yml.asc" \
            "$artifacts/SHA256SUMS" "$artifacts/SHA256SUMS.asc" \
            "$artifacts/build-fingerprint.txt"
